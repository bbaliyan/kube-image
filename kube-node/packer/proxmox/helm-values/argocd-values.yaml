# Genesis Argo CD values — rendered into the baked template's
# /opt/kube-compute/manifests/00-argocd.yaml via `helm template` at build
# time. Moved here from kube-compute's node-bootstrap, which used to render
# this live on every `tofu apply`. Only needs to produce *a* working Argo
# CD; kube-platform's bootstrap/templates/argocd-app.yaml carries the
# consumer's chosen ongoing version afterward.
configs:
  # How often Applications are compared, and how soon a failed comparison
  # is retried. On a new cluster, Applications wait on each other's CRDs and
  # credentials, and the default two minutes was most of the bring-up time.
  # Equal to kube-platform's bootstrap/templates/argocd-app.yaml.
  cm:
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 10s
  params:
    # TLS terminates upstream (ingress/load balancer); Argo CD serves plain HTTP behind it.
    server.insecure: "true"
# repo-server/controller ship with zero resource requests and a 1s probe
# timeout upstream — cheap insurance against a crash loop on a small box.
# No CPU limits, like kube-platform's argocd-app.yaml: they only throttle
# manifest generation, and set here they would outlive Argo CD adopting
# this install (another field manager owns them).
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
