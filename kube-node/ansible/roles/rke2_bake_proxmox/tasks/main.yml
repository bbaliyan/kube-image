# SPDX-License-Identifier: Apache-2.0
# Proxmox-only bake tasks, included alongside rke2_bake_common by
# kube-node/ansible/playbook-proxmox.yml.

# iscsi-initiator-utils provides iscsiadm and /etc/iscsi — needed by any
# iSCSI-backed CSI driver (e.g. democratic-csi's freenas-api-iscsi against a
# TrueNAS backend). Without it, the CSI node plugin's hostPath mount of
# /etc/iscsi fails outright (confirmed on a real cluster-media apply: the
# node pod stuck in ContainerCreating with "hostPath type check failed:
# /etc/iscsi is not a directory").
- name: proxmox | install iscsi-initiator-utils
  ansible.builtin.dnf:
    name: iscsi-initiator-utils
    state: present
  register: iscsi_package
  retries: 3
  delay: 15
  until: iscsi_package is succeeded

- name: proxmox | enable iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
