---
# SPDX-License-Identifier: Apache-2.0
k8s_version: ""
# Always passed via --extra-vars by the invoking Packer template, pointing
# at build.sh's rendered manifests. No real default — an empty string fails
# loudly (copy module errors on a nonexistent src) rather than silently
# baking nothing.
rendered_manifests_dir: ""

# Kept as toggles in case a future lighter/alternate image variant needs to
# skip one of these steps; no real build sets either false today.
bake_install_rke2: true
bake_copy_gitops_manifests: true

# Where the node bootstrap program comes from. Bump the ref when it changes.
kube_compute_raw_base: "https://raw.githubusercontent.com/bbaliyan/kube-compute"
kube_compute_ref: "69ef5e2fb1bcf057e6afcde4465e14aa0e64e4bc"

# Optional CA certificate on the build host, baked into the trust store.
trusted_ca_path: ""
