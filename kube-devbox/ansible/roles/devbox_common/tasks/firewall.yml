---
# SPDX-License-Identifier: Apache-2.0
# The allowed SSH sources are a launch-time input: cloud-init writes
# /etc/devbox/launch.env. The image holds no address.
- name: Firewall | firewalld would fight the box's own rules
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: false
    masked: true
  failed_when: false
  when: devbox_manage_services | bool

- name: Firewall | the launch input directory
  ansible.builtin.file:
    path: /etc/devbox
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Firewall | scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - devbox-firewall-apply
    - devbox-tailscale-up

- name: Firewall | units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - devbox-firewall-closed.service
    - devbox-firewall.service
    - devbox-tailscale.service
  register: devbox_firewall_units

- name: Firewall | enable the units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: "{{ devbox_firewall_units is changed }}"
  loop:
    - devbox-firewall-closed.service
    - devbox-firewall.service
    - devbox-tailscale.service
    - tailscaled.service
  when: devbox_manage_services | bool
