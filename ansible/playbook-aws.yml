---
# SPDX-License-Identifier: Apache-2.0
- name: RKE2 node bake (AlmaLinux 10, AWS)
  hosts: all
  gather_facts: true
  become: true
  vars:
    # AWS's node pool comes back as a fixed-size ASG (no cluster-autoscaler
    # integration yet), so this image never needs the CAPI/CAPMOX install
    # manifest rke2_bake_common's capi-related tasks stage for Proxmox's
    # cluster-autoscaler path.
    # Overriding the role default (true) here, rather than passing
    # rendered_capi_manifests_dir at all, keeps packer/aws/build.sh from
    # having to render (or fake) a CAPMOX-flavored manifest that has no AWS
    # equivalent.
    bake_stage_capi_manifests: false
    # Each reconnect attempt over ssh_interface=session_manager spins up a
    # whole new SSM session (an AWS API round-trip), not a cheap TCP retry
    # like Proxmox's direct-LAN-IP path — the defaults in
    # rke2_bake_common/defaults/main.yml retry too fast for that and mostly
    # burn time on doomed sessions before the SSM Agent's even back up.
    bake_reboot_connect_timeout: 15
    bake_reboot_post_delay: 30
  roles:
    - rke2_bake_common
    - rke2_bake_aws
