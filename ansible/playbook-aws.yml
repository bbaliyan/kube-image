---
# SPDX-License-Identifier: Apache-2.0
- name: RKE2 node bake (AlmaLinux 10, AWS)
  hosts: all
  gather_facts: true
  become: true
  vars:
    # AWS's node pool comes back as a fixed-size ASG with no
    # cluster-autoscaler integration yet, so this image never needs the
    # CAPI/CAPMOX manifest — overriding the role default here keeps
    # packer/aws/build.sh from having to render (or fake) one.
    bake_stage_capi_manifests: false
  roles:
    - rke2_bake_common
    - rke2_bake_aws
