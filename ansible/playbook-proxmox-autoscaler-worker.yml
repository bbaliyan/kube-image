---
# SPDX-License-Identifier: Apache-2.0
# proxmox-autoscaler-worker bake (AlmaLinux 10, Proxmox). Sibling to
# playbook-proxmox.yml, invoked by autoscaler-worker.pkr.hcl instead — reuses
# rke2_bake_common for the shared OS-prep/kernel-module steps, but disables
# that role's own RKE2-install, Cilium/Argo CD-manifest-copy, and
# CAPI-install-manifest-copy tasks (they'd otherwise defeat the point of this
# being the lighter image variant — see rke2_bake_common/defaults/main.yml).
# The CAPI/CAPMOX/CAPRKE2 install manifest (capi-install.yaml) is staged onto
# the OTHER image (playbook-proxmox.yml's control-plane build) instead —
# bootstrap.sh only ever applies it from the control-plane/genesis node,
# which never boots from this worker image. Still runs rke2_bake_proxmox:
# it's pure Proxmox/KVM guest OS behavior (the hot-added-vCPU udev rule),
# nothing to do with RKE2 install, and this is still a Proxmox VM either way.
# Adds rke2_bake_autoscaler_worker on top to stage RKE2's own air-gap
# artifacts for CAPRKE2's boot-time install.sh re-invocation.
- name: RKE2 autoscaler-worker node bake (AlmaLinux 10, Proxmox)
  hosts: all
  gather_facts: true
  become: true
  roles:
    - role: rke2_bake_common
      vars:
        bake_install_rke2: false
        bake_copy_gitops_manifests: false
        bake_stage_capi_manifests: false
    - rke2_bake_proxmox
    - rke2_bake_autoscaler_worker
