---
# SPDX-License-Identifier: Apache-2.0
# proxmox-autoscaler-worker bake (AlmaLinux 10, Proxmox). Sibling to
# playbook-proxmox.yml, invoked by autoscaler-worker.pkr.hcl instead — reuses
# rke2_bake_common for the shared OS-prep/kernel-module steps, but disables
# that role's own RKE2-install and Cilium/Argo CD-manifest-copy tasks (they'd
# otherwise defeat the point of this being the lighter image variant — see
# rke2_bake_common/defaults/main.yml). Still runs rke2_bake_proxmox: it's
# pure Proxmox/KVM guest OS behavior (the hot-added-vCPU udev rule), nothing
# to do with RKE2 install, and this is still a Proxmox VM either way. Adds
# rke2_bake_autoscaler_worker on top to stage the CAPI/CAPMOX/CAPRKE2 install
# manifests and RKE2's own air-gap artifacts.
- name: RKE2 autoscaler-worker node bake (AlmaLinux 10, Proxmox)
  hosts: all
  gather_facts: true
  become: true
  roles:
    - role: rke2_bake_common
      vars:
        bake_install_rke2: false
        bake_copy_gitops_manifests: false
    - rke2_bake_proxmox
    - rke2_bake_autoscaler_worker
