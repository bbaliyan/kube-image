---
# SPDX-License-Identifier: Apache-2.0
k8s_version: ""
# Always passed via --extra-vars by the invoking Packer template, pointing
# at build.sh's rendered manifests. No real default — an empty string fails
# loudly (copy module errors on a nonexistent src) rather than silently
# baking nothing.
rendered_manifests_dir: ""
rendered_capi_manifests_dir: ""

# All three default true. Kept as toggles in case a future lighter/alternate
# image variant needs to skip one of these steps; no real build sets any of
# them false today.
bake_install_rke2: true
bake_copy_gitops_manifests: true
bake_stage_capi_manifests: true

# ansible.builtin.reboot's own defaults. Fine for Proxmox, which reconnects
# over a direct LAN IP — cheap to retry fast. AWS overrides both in
# playbook-aws.yml, since its SSM-tunneled reconnect is much more expensive
# per attempt.
bake_reboot_connect_timeout: 5
bake_reboot_post_delay: 0

# Where the node bootstrap program comes from. Pinned to a kube-compute commit:
# a bake must be reproducible, and a commit sha pins content. Bump it when that
# program changes; the contract number inside it is what makes a mismatched pair
# fail loudly on the node rather than silently.
kube_compute_raw_base: "https://raw.githubusercontent.com/bbaliyan/kube-compute"
kube_compute_ref: "f68d721e7d7323909e803cdbe0ceac6cbb746836"

# Optional path on the BUILD HOST to a corporate CA PEM to bake into the image's
# trust store, at the one path kube-compute pins containerd's TLS to. Empty (the
# default) bakes none, and the PEM then travels in every node's user data
# instead. Never a path inside this repo -- nothing corporate is committed here.
trusted_ca_path: ""
