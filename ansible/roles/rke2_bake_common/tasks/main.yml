---
# SPDX-License-Identifier: Apache-2.0
# Provider-agnostic bake tasks — same AlmaLinux 10 base image, same OS-prep/
# RKE2-install/template-cleanup steps regardless of which provider's Packer
# template invokes this role. Provider-specific tasks (e.g. AWS's
# amazon-ssm-agent install) live in a separate rke2_bake_<provider> role.

- name: os-prep | inotify limits
  ansible.builtin.copy:
    src: 99-rke2-inotify.conf
    dest: /etc/sysctl.d/99-rke2-inotify.conf
    mode: "0644"
  register: inotify_conf

- name: os-prep | apply inotify limits immediately
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-rke2-inotify.conf
  when: inotify_conf.changed

- name: os-prep | permanently quiesce background dnf/rpm-lock holders
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - packagekit
    - packagekit.socket
    - dnf-makecache.timer
    - dnf-makecache.service
  failed_when: false

- name: os-prep | run dnf update -y (retry + self-heal on lock contention)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for attempt in 1 2 3 4 5; do
        dnf update -y && exit 0
        [ "$attempt" -eq 5 ] && exit 1
        sleep 15
        pkill -x dnf 2>/dev/null || true
        pkill -x rpm 2>/dev/null || true
      done
  changed_when: true

# Unconditional, not gated on a needs-restarting check: a full dnf update
# against a stale base image needs a reboot on virtually every bake anyway
# (kernel/glibc bumps are near-universal), so the check cost more build time
# on average than it saved.
- name: os-prep | reboot after the OS update
  ansible.builtin.reboot:
    reboot_timeout: 600
    connect_timeout: "{{ bake_reboot_connect_timeout }}"
    post_reboot_delay: "{{ bake_reboot_post_delay }}"

- name: os-prep | install ca-certificates and curl, load br_netfilter/overlay
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dnf install -y ca-certificates curl kernel-modules-extra-matched
      # AlmaLinux 10's minimal image ships only kernel-modules-core, which
      # excludes nft_compat (the iptables-nft translation shim). Cilium's
      # default VXLAN mode needs it — without it, Cilium's iptables
      # reconciliation fails and freshly created pods become unreachable.
      # "-matched" (not a pinned NVR): BaseOS only keeps this subpackage for
      # the latest kernel, so a pinned request can match nothing.
      modprobe nft_compat
      # RHEL10 kernels (6.12+) dropped br_netfilter — bridged traffic is
      # filtered natively via nftables bridge hooks. RHEL9 kernels still
      # ship it and need both.
      if modinfo br_netfilter >/dev/null 2>&1; then
        printf 'br_netfilter\noverlay\n' >/etc/modules-load.d/rke2.conf
        modprobe br_netfilter
      else
        printf 'overlay\n' >/etc/modules-load.d/rke2.conf
      fi
      modprobe overlay
      printf 'net.ipv4.ip_forward = 1\n' >/etc/sysctl.d/98-rke2-bridge.conf
      if [ -d /proc/sys/net/bridge ]; then
        printf 'net.bridge.bridge-nf-call-iptables = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\n' >>/etc/sysctl.d/98-rke2-bridge.conf
      fi
      sysctl --system
    creates: /etc/modules-load.d/rke2.conf

- name: os-prep | label the local-path-provisioner directory for container write access
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dnf install -y policycoreutils-python-utils
      mkdir -p /var/lib/rancher/local-path-provisioner
      if ! semanage fcontext -l | grep -q '^/var/lib/rancher/local-path-provisioner(/\.\*)?  '; then
        semanage fcontext -a -t container_file_t '/var/lib/rancher/local-path-provisioner(/.*)?'
      fi
      restorecon -R /var/lib/rancher/local-path-provisioner

- name: selinux-prep | add the rancher-rke2-common repo
  ansible.builtin.yum_repository:
    name: rancher-rke2-common-stable
    description: Rancher RKE2 Common (stable)
    baseurl: https://rpm.rancher.io/rke2/stable/common/centos/9/noarch
    enabled: true
    gpgcheck: true
    gpgkey: https://rpm.rancher.io/public.key

- name: selinux-prep | import the Rancher GPG key (retry — transient failures)
  ansible.builtin.rpm_key:
    key: https://rpm.rancher.io/public.key
    state: present
  register: gpg_import
  retries: 3
  delay: 10
  until: gpg_import is succeeded

- name: selinux-prep | install rke2-selinux (retry + self-heal on lock contention)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dnf makecache
      for attempt in 1 2 3 4 5; do
        dnf install -y rke2-selinux && exit 0
        [ "$attempt" -eq 5 ] && exit 1
        sleep 15
        pkill -x dnf 2>/dev/null || true
        pkill -x rpm 2>/dev/null || true
      done
  changed_when: true

# e.g. "v1.36.2+rke2r1" -> "1.36.2~rke2r1", the NEVRA rpm.rancher.io actually
# publishes (confirmed via repoquery). Used below to pin every rke2-*
# package explicitly.
- name: rke2 | compute the RPM-style version string for k8s_version
  ansible.builtin.set_fact:
    rke2_rpm_version: "{{ k8s_version | regex_replace('^v', '') | regex_replace('\\+', '~') }}"

# get.rke2.io's rpm-method install only installs rke2-server (INSTALL_RKE2_TYPE
# defaults to "server"). It does add the Rancher RKE2 repos as a side
# effect, which the next task relies on for rke2-agent.
- name: rke2 | install RKE2 server (also adds the Rancher RKE2 repos)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      curl -sfL https://get.rke2.io | sh -
    creates: /usr/bin/rke2
  environment:
    INSTALL_RKE2_VERSION: "{{ k8s_version }}"
  when: bake_install_rke2

# rke2-server's dependency on rke2-common is unversioned, and the
# "1.36-stable" repo keeps every recent patch build available at once, so
# dnf's solver can land rke2-common on a different patch than rke2-server's
# pin. Confirmed on a real bake: rke2-server pinned correctly to 1.36.2 but
# rke2-common landed on 1.36.3, and `rke2 -v` reported the wrong version.
- name: rke2 | pin rke2-common to the exact k8s_version (dnf otherwise resolves it independently of rke2-server)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dnf install -y "rke2-common-{{ rke2_rpm_version }}"
  when: bake_install_rke2
  changed_when: true

# Without this, only rke2-server.service exists, so a worker clone's
# cloud-init `systemctl enable --now rke2-agent.service` fails outright.
# Role selection (which unit to enable) is a launch-time decision — this
# just ensures both are present, unstarted, on every image. Explicitly
# pinned for the same reason as rke2-common above.
- name: rke2 | also install rke2-agent (get.rke2.io only installs rke2-server by default)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for attempt in 1 2 3 4 5; do
        dnf install -y "rke2-agent-{{ rke2_rpm_version }}" && exit 0
        [ "$attempt" -eq 5 ] && exit 1
        sleep 15
        pkill -x dnf 2>/dev/null || true
        pkill -x rpm 2>/dev/null || true
      done
    creates: /usr/lib/systemd/system/rke2-agent.service
  when: bake_install_rke2

# Pre-rendered on the Packer build host (each provider's build.sh runs helm
# template there, not here) and copied in as plain files — this VM never
# runs helm or reaches a chart repo. node-bootstrap applies whichever of
# these a given cluster needs at first boot.
- name: gitops | create the genesis manifests directory
  ansible.builtin.file:
    path: /opt/kube-compute/manifests
    state: directory
    mode: "0700"
    owner: root
    group: root
  when: bake_copy_gitops_manifests or bake_stage_capi_manifests

- name: gitops | copy the pre-rendered Cilium/Argo CD manifests
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/opt/kube-compute/manifests/{{ item.dest }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - { src: "{{ rendered_manifests_dir }}/cilium.yaml", dest: "cilium.yaml" }
    - { src: "{{ rendered_manifests_dir }}/00-argocd.yaml", dest: "00-argocd.yaml" }
  when: bake_copy_gitops_manifests

# Baked in unconditionally on Proxmox (playbook-proxmox.yml leaves
# bake_stage_capi_manifests at its true default); whether a cluster actually
# needs it is a runtime decision at bootstrap.sh/apply time. AWS has no
# CAPI/CAPMOX equivalent yet, so playbook-aws.yml sets this false.
- name: capi | copy the rendered CAPI install manifest
  ansible.builtin.copy:
    src: "{{ rendered_capi_manifests_dir }}/capi-install.yaml"
    dest: /opt/kube-compute/manifests/capi-install.yaml
    mode: "0600"
    owner: root
    group: root
  when: bake_stage_capi_manifests

# Everything below is template-prep cleanup and MUST stay last: clones must
# not inherit this builder's machine identity, SSH host keys, or the Packer
# build-time SSH key, and cloud-init must re-run fresh on every clone.
- name: template-prep | clean cloud-init state so clones re-run it fresh
  ansible.builtin.command: cloud-init clean --logs --seed
  changed_when: true

- name: template-prep | reset machine-id so clones each generate their own
  ansible.builtin.file:
    path: /etc/machine-id
    state: absent

- name: template-prep | recreate empty machine-id (systemd expects the file to exist)
  ansible.builtin.file:
    path: /etc/machine-id
    state: touch
    mode: "0444"

- name: template-prep | remove SSH host keys so clones each generate their own
  ansible.builtin.shell:
    cmd: rm -f /etc/ssh/ssh_host_*
  changed_when: true

- name: template-prep | remove the Packer build-time SSH authorized_keys
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    state: absent
  when: ansible_user != "root"

- name: template-prep | remove root's authorized_keys too, if present
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent

- name: template-prep | clean dnf cache
  ansible.builtin.command: dnf clean all
  changed_when: true
