# Proxmox-only bake tasks. Included alongside rke2_bake_common by
# ansible/playbook-proxmox.yml — never gated behind a runtime node_provider
# variable, since each provider already gets its own Packer template and
# playbook, so the provider is known at build-invocation time, not runtime.

- name: os-prep | hot-added vCPU online rule (Proxmox/KVM guest)
  # Proxmox is the only provider that ever hot-adds a vCPU to a running
  # guest; AWS/Azure don't, so this stays out of rke2_bake_common entirely.
  ansible.builtin.copy:
    src: 80-hotplug-cpu-online.rules
    dest: /etc/udev/rules.d/80-hotplug-cpu-online.rules
    mode: "0644"
