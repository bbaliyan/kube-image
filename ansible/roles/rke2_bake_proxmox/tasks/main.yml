# SPDX-License-Identifier: Apache-2.0
# Proxmox-only bake tasks, included alongside rke2_bake_common by
# ansible/playbook-proxmox.yml.

# iscsi-initiator-utils provides iscsiadm and /etc/iscsi — needed by any
# iSCSI-backed CSI driver (e.g. democratic-csi's freenas-api-iscsi against a
# TrueNAS backend). Proxmox-only, not part of rke2_bake_common: AWS clusters
# use aws-ebs-csi-driver (EBS, not iSCSI) and have no consumer for this
# package. Without it, the CSI node plugin's hostPath mount of /etc/iscsi
# fails outright (confirmed on a real cluster-media apply: the node pod
# stuck in ContainerCreating with "hostPath type check failed: /etc/iscsi is
# not a directory").
- name: proxmox | install iscsi-initiator-utils (retry + self-heal on lock contention)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for attempt in 1 2 3 4 5; do
        dnf install -y iscsi-initiator-utils && exit 0
        [ "$attempt" -eq 5 ] && exit 1
        sleep 15
        pkill -x dnf 2>/dev/null || true
        pkill -x rpm 2>/dev/null || true
      done
    creates: /etc/iscsi
  changed_when: true

- name: proxmox | enable iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
