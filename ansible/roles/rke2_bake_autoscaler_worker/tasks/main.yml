---
# SPDX-License-Identifier: Apache-2.0
# proxmox-autoscaler-worker-only bake tasks. Included by
# playbook-proxmox-autoscaler-worker.yml in place of rke2_bake_proxmox — this
# role does NOT run any rke2 install (rke2_bake_common's own install task is
# disabled for this playbook via bake_install_rke2: false). It only stages
# files for CAPRKE2's own boot-time install.sh invocation to consume later:
# that's the entire point of this being the lighter image variant (see
# packer/proxmox/autoscaler-worker.pkr.hcl and this project's plan doc for
# the full rationale).
#
# Does NOT stage capi-install.yaml (the CAPI/CAPMOX/CAPRKE2 install
# manifest) — that manifest is only ever `kubectl apply`'d by bootstrap.sh on
# the control-plane/genesis node, which boots from the rke2-proxmox image
# (playbook-proxmox.yml / rke2_bake_common), never from this worker image.
# It used to be staged here too, which meant any cluster with
# cluster_autoscaler_enabled=true failed bootstrap.sh entirely on the
# control-plane node (the file it was told to apply didn't exist there) —
# see rke2_bake_common/tasks/main.yml for where this is staged now.

- name: Create RKE2 air-gap artifact directory
  ansible.builtin.file:
    path: /opt/rke2-artifacts
    state: directory
    mode: "0755"

- name: Copy RKE2 air-gap artifacts
  ansible.builtin.copy:
    src: "{{ rendered_rke2_artifacts_dir }}/{{ item }}"
    dest: "/opt/rke2-artifacts/{{ item }}"
    mode: "0644"
  loop:
    - rke2.linux-amd64.tar.gz
    - rke2-images.linux-amd64.tar.zst
    - sha256sum-amd64.txt

- name: Copy RKE2 install script
  ansible.builtin.copy:
    src: "{{ rendered_rke2_artifacts_dir }}/install.sh"
    dest: /opt/install.sh
    mode: "0755"
