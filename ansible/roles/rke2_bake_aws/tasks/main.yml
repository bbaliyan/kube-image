---
# SPDX-License-Identifier: Apache-2.0
# AWS-only bake tasks, included alongside rke2_bake_common by
# ansible/playbook-aws.yml. The AlmaLinux 10 AMI's own cloud-init/ENA/NVMe
# drivers are already correct out of the box, so amazon-ssm-agent is the one
# genuinely AWS-specific thing this bake needs.

# kube-compute's AWS modules use SSM as their entire operator-access path
# (break-glass shell, verb-scripts, kubeconfig fetch) with no other
# transport (CLAUDE.md hard constraint #6), and their launch-time
# `systemctl enable --now amazon-ssm-agent` swallows failure silently. The
# base AMI does already ship the agent — this template's own builds worked
# over SSM before the switch to direct SSH, which could only succeed if it
# were already installed — but this task keeps that guarantee explicit
# rather than assumed, so a future AlmaLinux point release that drops the
# package fails loudly here instead of leaving every node unreachable.
- name: aws | install amazon-ssm-agent (retry + self-heal on lock contention)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for attempt in 1 2 3 4 5; do
        dnf install -y "https://s3.{{ aws_region }}.amazonaws.com/amazon-ssm-{{ aws_region }}/latest/linux_amd64/amazon-ssm-agent.rpm" && exit 0
        [ "$attempt" -eq 5 ] && exit 1
        sleep 15
        pkill -x dnf 2>/dev/null || true
        pkill -x rpm 2>/dev/null || true
      done
    creates: /usr/bin/amazon-ssm-agent
  changed_when: true

# Not started here — aws-control-plane/aws-node-pool's launch-time
# `systemctl enable --now amazon-ssm-agent` already does that on every real
# boot, and template-prep below resets machine-id/cloud-init state anyway.
