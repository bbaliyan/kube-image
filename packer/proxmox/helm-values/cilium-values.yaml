# Genesis Cilium values — rendered into the baked template's
# /opt/kube-compute/manifests/cilium.yaml via `helm template` at build time.
# Moved here from kube-compute's node-bootstrap, which used to render this
# live on every `tofu apply` (blew Proxmox's 1 MiB cicustom snippet cap).
# Kept in sync with kube-platform's bootstrap/templates/cilium-app.yaml,
# authoritative once Argo CD adopts this genesis install.
kubeProxyReplacement: true
k8sServiceHost: "127.0.0.1"
k8sServicePort: 6443
# Node IPAM LB: advertises the node's own IP into a LoadBalancer Service,
# eBPF forwarding to pods — no ARP/BGP/cloud API/extra component needed.
nodeIPAM:
  enabled: true
defaultLBServiceIPAM: nodeipam
operator:
  # A single-node cluster is this project's current primary target;
  # cilium-operator's chart default (2 replicas, anti-affinity) leaves a
  # second replica permanently Pending on one node. A multi-node consumer
  # gets 2 back the moment Argo CD adopts this install.
  replicas: 1
  tolerations:
    - operator: Exists
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
