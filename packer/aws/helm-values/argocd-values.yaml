# Genesis Argo CD values — rendered into the baked AMI's
# /opt/kube-compute/manifests/00-argocd.yaml via `helm template` at build
# time. Deliberate duplicate of
# packer/proxmox/helm-values/argocd-values.yaml (each provider's Packer
# template is self-contained) — keep both in sync by hand. Only needs to
# produce *a* working Argo CD; kube-platform's own
# bootstrap/templates/argocd-app.yaml carries the consumer's chosen ongoing
# version afterward.
configs:
  params:
    # Deliberate: TLS terminates upstream (ingress / load balancer); Argo CD serves plain HTTP behind it.
    server.insecure: "true"
# repo-server and application-controller ship with zero resource requests
# (BestEffort QoS) and a 1s probe timeoutSeconds upstream — cheap insurance
# against a repo-server/controller crash loop under scheduling jitter on a
# small box.
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
